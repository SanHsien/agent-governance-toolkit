name: Fork maintenance

on:
  push:
    branches: [main]
    paths:
      - FORK.md
      - NOTICE.md
      - REVIEW.md
      - CLAUDE.md
      - AGENTS.md
      - README.md
      - README.en.md
      - SECURITY.md
      - CONTRIBUTING.md
      - docs/fork/**
      - tools/**
      - agent-governance-python/agent-os/src/agent_os/mcp_auth_enforcement.py
      - agent-governance-python/agent-os/tests/test_mcp_auth_enforcement.py
      - requirements-dev.txt
      - .github/workflows/fork-maintenance.yml
      - .github/workflows/upstream-check.yml
      - .github/workflows/*.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fork gate (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install fork-gate dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Canonical fork gate (Windows)
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev_check.ps1
