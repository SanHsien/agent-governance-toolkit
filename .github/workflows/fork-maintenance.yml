name: Fork maintenance

on:
  push:
    branches: [main]
    paths:
      - FORK.md
      - NOTICE.md
      - REVIEW.md
      - CLAUDE.md
      - AGENTS.md
      - README.md
      - SECURITY.md
      - CONTRIBUTING.md
      - docs/fork/**
      - tools/**
      - requirements-dev.txt
      - .github/workflows/fork-maintenance.yml
      - .github/workflows/upstream-check.yml
      - .github/workflows/*.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fork gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install fork-gate dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Canonical fork gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev_check.ps1

      - name: Canonical fork gate
        if: runner.os != 'Windows'
        run: |
          python -m compileall -q tools
          python -m ruff check --select E9,F --target-version py310 tools
          python -m pytest -c tools/pytest.ini tools/tests
          python tools/check_links.py
