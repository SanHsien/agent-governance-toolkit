name: Fork product Windows

on:
  push:
    branches: [main]
    paths: &product_paths
      - 'agent-governance-rust/**'
      - 'policy-engine/**'
      - 'agent-governance-python/agent-os/extensions/copilot/**'
      - '.github/workflows/fork-product-windows.yml'
      - 'tools/tests/test_fork_product_windows.py'
  pull_request:
    branches: [main]
    paths: *product_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-product-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  rust:
    if: github.repository == 'SanHsien/agent-governance-toolkit'
    name: fork Rust workspace (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent-governance-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Enable installed MSVC tools
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Hosted Windows MSVC tools unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-Command cl.exe, link.exe -ErrorAction Stop
          foreach ($key in @('INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'VSCMD_ARG_TGT_ARCH')) {
            $value = [Environment]::GetEnvironmentVariable($key)
            if ($value) { "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          $env:PATH.Split(';') | Where-Object { $_ } | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build locked Rust workspace
        timeout-minutes: 30
        run: cargo build --release --workspace --locked
      - name: Test locked Rust workspace
        timeout-minutes: 25
        run: cargo test --release --workspace --locked
      - name: Reject lockfile mutation
        run: git diff --exit-code -- Cargo.lock

  copilot:
    if: github.repository == 'SanHsien/agent-governance-toolkit'
    name: fork Copilot extension (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-governance-python/agent-os/extensions/copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked extension dependencies
        timeout-minutes: 10
        run: npm ci --ignore-scripts
      - name: Build extension
        timeout-minutes: 5
        run: npm run build
      - name: Run extension Jest tests
        timeout-minutes: 5
        run: npm test -- --runInBand
      - name: Reject lockfile mutation
        run: git diff --exit-code -- package-lock.json

  node:
    if: github.repository == 'SanHsien/agent-governance-toolkit'
    name: fork native policy Node SDK (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: policy-engine/sdk/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Enable installed MSVC tools
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Hosted Windows MSVC tools unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-Command cl.exe, link.exe -ErrorAction Stop
          foreach ($key in @('INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'VSCMD_ARG_TGT_ARCH')) {
            $value = [Environment]::GetEnvironmentVariable($key)
            if ($value) { "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          $env:PATH.Split(';') | Where-Object { $_ } | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install locked SDK dependencies
        timeout-minutes: 10
        run: npm ci --ignore-scripts
      - name: Fetch checksum-pinned Windows OPA
        timeout-minutes: 5
        run: |
          node scripts/fetch-opa.mjs --platform win32-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & './npm/agent-control-specification-opa-win32-x64/bin/opa.exe' version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build once and test native SDK with bundled OPA
        timeout-minutes: 40
        run: |
          npm run test:ci 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/node-sdk-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tap = Get-Content "$env:RUNNER_TEMP/node-sdk-tests.log" -Raw
          foreach ($name in @('zero-config fromPath builds with bundled defaults', 'zero-config fromPath uses bundled opa with an empty PATH')) {
            if ($tap -notmatch "(?m)^ok \d+ - $([regex]::Escape($name))\r?$") {
              throw "Required OPA test did not pass without skip: $name"
            }
          }
      - name: Reject manifest and lockfile mutation
        run: git diff --exit-code -- package.json package-lock.json ../../Cargo.lock
